# One Express process serves client/dist and /api. One Postgres database.
# sync: false vars are typed in the Blueprint form. Do not commit their values.
services:
  - type: web
    name: stub
    runtime: node
    plan: free
    buildCommand: npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: stub-db
    plan: free
    databaseName: stub
    user: stub

